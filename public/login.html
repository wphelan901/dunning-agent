<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In — Dunning Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0e; --bg2: #161614; --bg3: #1c1c19;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.14);
    --text: #f0ede8; --text2: #8a8780; --text3: #5a5855;
    --amber: #e8a435; --amber-dim: rgba(232,164,53,0.12);
    --red: #d94f4f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .card {
    position: relative; z-index: 1;
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 12px;
    padding: 40px 44px;
    width: 380px;
    max-width: 90vw;
  }
  .logo {
    font-family: 'Instrument Serif', serif;
    font-size: 24px;
    color: var(--text);
    margin-bottom: 6px;
  }
  .logo em { font-style: italic; color: var(--amber); }
  .tagline {
    font-size: 11px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .field { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 11px;
    color: var(--text3);
    font-family: 'DM Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
  }
  input[type="text"], input[type="password"] {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--amber); }
  .btn-login {
    width: 100%;
    margin-top: 8px;
    background: var(--amber);
    border: none;
    border-radius: 6px;
    padding: 11px;
    font-size: 14px;
    font-weight: 500;
    color: #0f0f0e;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: opacity 0.15s;
  }
  .btn-login:hover { opacity: 0.88; }
  .btn-login:disabled { opacity: 0.4; cursor: default; }
  .error {
    background: rgba(217,79,79,0.1);
    border: 1px solid rgba(217,79,79,0.25);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 13px;
    color: var(--red);
    margin-bottom: 16px;
    display: none;
  }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Dunning <em>Agent</em></div>
  <div class="tagline">Accounts receivable · ABCT</div>
  <div class="error" id="err"></div>
  <div class="field">
    <label>Username</label>
    <input type="text" id="username" autocomplete="username" autofocus>
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password">
  </div>
  <button class="btn-login" id="btn" onclick="login()">Sign in</button>
</div>
<script>
  document.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  async function login() {
    const btn = document.getElementById('btn');
    const err = document.getElementById('err');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      window.location.href = '/';
    } catch(e) {
      err.textContent = e.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  }
</script>
</body>
</html>
